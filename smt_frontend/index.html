<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>SMT Fruits | Management System</title>
    <meta
      name="description"
      content="Professional POS and Inventory Management System for SMT Fruits."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- PRE-LOADER STYLING --- */
      /* This ensures the user sees something professional while the JS bundles download */
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc; /* slate-50 */
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 9999;
        transition: opacity 0.5s ease-in-out;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #f1f5f9;
        border-bottom-color: #10b981;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }

      .loading-text {
        margin-top: 1.5rem;
        font-weight: 800;
        color: #1e293b;
        letter-spacing: 0.1em;
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p class="loading-text">Starting SMT-OS...</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
