<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>SMT Fruits | Management System</title>
    <meta
      name="description"
      content="Professional POS and Inventory Management System for SMT Fruits."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- PRE-LOADER STYLING --- */
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        /* Consistent Slate-50 base */
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        /* Matched to body to eliminate bright white screen flash */
        z-index: 9999;
        transition: opacity 0.4s ease-in-out;
      }

      .spinner {
        width: 44px;
        /* Slightly tighter, professional sizing */
        height: 44px;
        border: 4px solid #e2e8f0;
        /* slate-200 for smoother track contrast */
        border-bottom-color: #10b981;
        /* Brand emerald color */
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 0.8s cubic-bezier(0.6, 0.2, 0.1, 1) infinite;
        /* Premium easing curve */
      }

      .loading-text {
        margin-top: 1.25rem;
        font-weight: 700;
        color: #334155;
        /* slate-700 for a cleaner, modern look */
        letter-spacing: 0.15em;
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p class="loading-text">Starting SMT-OS</p>
      </div>
    </div>

    <script type="module" src="/src2/main.jsx"></script>
  </body>
</html>
